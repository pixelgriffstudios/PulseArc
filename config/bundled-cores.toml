# Libretro cores that are not currently shipped by Arch Linux. Each core is
# extracted from the published PlayFusion 1.0 runtime collection. The outer
# EROFS image is verified by runtime-lock.json and the extracted binary is
# verified again here before it enters the PulseArc root filesystem.

[core.puae]
package = "pulsearc-libretro-puae"
asset = "playfusion-amiga"
archive_path = ".config/retroarch/cores/puae_libretro.so"
target = "/usr/lib/libretro/puae_libretro.so"
sha256 = "ebfb55ca1e909bffdb0d9c133d619f998e20c4aa0a7e05c1e481da93a286ce8c"

